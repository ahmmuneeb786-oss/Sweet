<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet Chat</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF69B4">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!-- Paint the saved theme before React loads, so there is no flash of
         the default colours. Keep the key in sync with src/theme/cache.ts. -->
    <script>
      try {
        var c = JSON.parse(localStorage.getItem('sweet_theme_v1') || 'null');
        if (c && c.vars) {
          var r = document.documentElement;
          for (var k in c.vars) {
            if (/^--th-[a-z-]+$/.test(k) && /^\d{1,3} \d{1,3} \d{1,3}$/.test(c.vars[k])) r.style.setProperty(k, c.vars[k]);
          }
          if (c.legacy === 'dark') r.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>

    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
